<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urban Threads | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="index.html" class="logo">Urban Threads</a>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="shop.html">Shop</a>
          <a href="login.html">Login</a>
          <a href="cart.html">Cart <span id="cart-count">0</span></a>
        </nav>
      </div>
    </header>

    <main class="auth-page section">
      <div class="container auth-shell">

        <!-- Login card -->
        <div class="auth-card" id="card-login">
          <h1>Welcome back</h1>
          <p>Sign in to track orders and save your favorites.</p>
          <form id="login-form" class="auth-form">
            <label>
              Email
              <input
                type="email"
                id="login-email"
                placeholder="you@example.com"
                required
              />
            </label>
            <label>
              Password
              <input
                type="password"
                id="login-password"
                placeholder="••••••••"
                required
              />
            </label>
            <button type="submit" class="btn btn-primary">Login</button>
          </form>
          <p id="auth-message" class="auth-message"></p>
          <p class="auth-switch">
            Don't have an account?
            <button class="link-btn" id="show-signup">Create one</button>
          </p>
        </div>

        <!-- Sign-up card (hidden by default) -->
        <div class="auth-card" id="card-signup" hidden>
          <h1>Create account</h1>
          <p>Join Urban Threads and start shopping.</p>
          <form id="signup-form" class="auth-form">
            <label>
              Email
              <input
                type="email"
                id="signup-email"
                placeholder="you@example.com"
                required
              />
            </label>
            <label>
              Password
              <input
                type="password"
                id="signup-password"
                placeholder="At least 6 characters"
                required
              />
            </label>
            <label>
              Confirm password
              <input
                type="password"
                id="signup-confirm"
                placeholder="Repeat your password"
                required
              />
            </label>
            <button type="submit" class="btn btn-primary">Create account</button>
          </form>
          <p id="signup-message" class="auth-message"></p>
          <p class="auth-switch">
            Already have an account?
            <button class="link-btn" id="show-login">Sign in</button>
          </p>
        </div>

      </div>
    </main>

    <script>
      // Toggle between the two cards without a page reload
      document.addEventListener("DOMContentLoaded", () => {
        const loginCard  = document.getElementById("card-login");
        const signupCard = document.getElementById("card-signup");

        document.getElementById("show-signup").addEventListener("click", () => {
          loginCard.hidden  = true;
          signupCard.hidden = false;
        });

        document.getElementById("show-login").addEventListener("click", () => {
          signupCard.hidden = true;
          loginCard.hidden  = false;
        });
      });
    </script>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© 2026 Urban Threads</p>
      </div>
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
